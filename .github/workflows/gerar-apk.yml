name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Flet
        run: pip install flet
      - name: Gerar APK
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: flet build apk --project "Agro Money" --org br.agromoney --product "Agro Money"
      - uses: actions/upload-artifact@v4
        with:
          name: agro-money-apk
          path: build/apk/*.apk
